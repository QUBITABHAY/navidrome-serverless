name: Cloudflare R2 Library Sync

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run R2 Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ND_R2_ACCOUNTID: ${{ secrets.ND_R2_ACCOUNTID }}
          ND_R2_ACCESSKEYID: ${{ secrets.ND_R2_ACCESSKEYID }}
          ND_R2_SECRETACCESSKEY: ${{ secrets.ND_R2_SECRETACCESSKEY }}
          ND_R2_BUCKET: ${{ secrets.ND_R2_BUCKET }}
          ND_R2_PUBLICURL: ${{ secrets.ND_R2_PUBLICURL }}
          ND_LOGLEVEL: info
        run: |
          go run main.go scan-r2
